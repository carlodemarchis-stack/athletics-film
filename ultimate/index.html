<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ultimate Championship — Budapest 2026</title>
<meta name="theme-color" content="#0a0807">
<meta name="description" content="Every event of the 2026 World Athletics Ultimate Championship, one card at a time — start lists as they are published, results as they land.">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%230a0807'/><g stroke='%23e2572f' stroke-width='2.2' stroke-linecap='round'><path d='M5 11h22M5 21h22'/></g><path d='M24 3.5v25' stroke='%23f2c14e' stroke-width='2.6'/></svg>">
<style>
  :root{
    --bg0:#0a0807; --bg1:#1a100c; --bg2:#2b1610;
    --ink:#f6efe9; --muted:#b39a8c; --muted-2:#7c675c;
    --line:rgba(230,190,160,.14);
    --acc:#e2572f; --gold:#f2c14e; --men:#6f8fb8; --women:#d9834a;
    --track:#c2410c;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg0);color:var(--ink);
    font-family:"Helvetica Neue",Arial,system-ui,sans-serif;-webkit-font-smoothing:antialiased;
    overflow:hidden}

  /* ---------- chrome ---------- */
  .top{display:flex;align-items:flex-end;gap:22px;padding:20px 34px 0}
  .brand{font-size:10.5px;font-weight:800;letter-spacing:.22em;text-transform:uppercase;color:var(--muted-2)}
  .brand b{color:var(--acc)}
  .days{display:flex;gap:6px;margin-left:auto}
  .day{font-size:12px;font-weight:800;letter-spacing:.04em;border:1px solid var(--line);
    background:transparent;color:var(--muted);border-radius:999px;padding:7px 15px;cursor:pointer;
    font-family:inherit;transition:.15s;white-space:nowrap}
  .day:hover{color:var(--ink)}
  .day.on{color:var(--gold);border-color:rgba(242,193,78,.45);background:rgba(242,193,78,.1)}
  .day i{font-style:normal;color:var(--muted-2);font-weight:700;margin-left:7px}
  .day.on i{color:rgba(242,193,78,.7)}

  /* ---------- card ---------- */
  .card{position:relative;height:calc(100vh - 58px);padding:14px 34px 22px;display:flex;
    flex-direction:column;overflow:hidden}
  /* a hurdles/sprint card runs lane lines under everything; field events will want their own */
  .card.track::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.5;
    background:repeating-linear-gradient(180deg,transparent 0 62px,rgba(226,87,47,.07) 62px 63px);
    mask-image:linear-gradient(180deg,transparent,#000 22%,#000 70%,transparent)}
  .card::after{content:"";position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(900px 500px at 88% -8%,rgba(226,87,47,.16),transparent 62%)}
  .card > *{position:relative;z-index:1}

  .head{display:flex;align-items:flex-start;gap:26px}
  .kicker{font-size:10.5px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;
    color:var(--muted-2);display:flex;align-items:center;gap:10px}
  .kicker .sx{color:var(--men)}
  .kicker .type{color:var(--acc)}
  h1{font-size:clamp(30px,4.4vw,54px);letter-spacing:-.025em;margin:5px 0 0;line-height:1}
  .when{margin-left:auto;text-align:right;flex:0 0 auto}
  .when .st{font-size:10.5px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;
    color:var(--gold)}
  .when .dt{font-size:13px;color:var(--muted);margin-top:5px}

  /* ---------- the final ---------- */
  .body{flex:1 1 auto;display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);
    gap:26px;margin-top:16px;min-height:0}
  .panel{min-width:0;display:flex;flex-direction:column;min-height:0}
  .plabel{font-size:10.5px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;
    color:var(--muted-2);display:flex;align-items:baseline;gap:10px;margin-bottom:10px}
  .plabel b{color:var(--ink)}
  .plabel .wind{margin-left:auto;color:var(--muted-2);font-weight:700;letter-spacing:.04em}

  .podium{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
  .pod{position:relative;border:1px solid var(--line);border-radius:14px;overflow:hidden;
    background:linear-gradient(180deg,var(--bg1),#120c08);min-height:190px;display:flex;
    flex-direction:column;justify-content:flex-end;padding:14px 15px}
  .pod .ph{position:absolute;inset:0;background-size:cover;background-position:50% 22%;
    filter:grayscale(1) contrast(1.06);opacity:.5}
  .pod .scrim{position:absolute;inset:0;
    background:linear-gradient(180deg,rgba(10,8,7,.1) 0%,rgba(10,8,7,.86) 62%,rgba(10,8,7,.97) 100%)}
  .pod.gold{border-color:rgba(242,193,78,.45)}
  .pod.gold .ph{filter:none;opacity:.55}
  .pod > *{position:relative}
  .pos{position:absolute;top:11px;left:14px;font-size:34px;font-weight:800;line-height:1;
    color:rgba(246,239,233,.22);z-index:1}
  .pod.gold .pos{color:var(--gold);opacity:.85}
  .pod .nm{font-size:17px;font-weight:800;letter-spacing:-.01em;line-height:1.15}
  .pod .nat{font-size:11px;font-weight:800;letter-spacing:.14em;color:var(--muted-2);margin-top:3px}
  .pod .mk{font-size:30px;font-weight:800;letter-spacing:-.02em;margin-top:8px;
    font-variant-numeric:tabular-nums}
  .pod.gold .mk{color:var(--gold)}
  .pod .tag{display:inline-block;font-size:9.5px;font-weight:800;letter-spacing:.12em;
    text-transform:uppercase;color:var(--bg0);background:var(--gold);border-radius:5px;
    padding:3px 6px;margin-top:7px}

  /* ---------- the rest of a field, and the semis ---------- */
  table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
  th{font-size:9.5px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;
    color:var(--muted-2);text-align:left;padding:0 0 6px}
  th.r,td.r{text-align:right}
  td{font-size:13px;padding:5px 0;border-top:1px solid rgba(230,190,160,.07)}
  td.p{width:26px;color:var(--muted-2);font-weight:800}
  td.n{font-weight:700}
  td.c{width:44px;color:var(--muted-2);font-size:11px;font-weight:800;letter-spacing:.08em}
  td.m{width:74px;font-weight:800}
  tr.out td{color:var(--muted-2)}
  tr.out td.m{color:var(--acc);font-size:11.5px;letter-spacing:.1em}
  tr.q td.m{color:var(--gold)}
  .rest{margin-top:14px;overflow:auto;min-height:0}

  .semis{display:grid;grid-template-rows:1fr 1fr;gap:16px;min-height:0}
  .semi{min-height:0;display:flex;flex-direction:column}
  .semi .sc{overflow:auto;min-height:0}

  /* ---------- tabs: the final is the card, the semis are behind it ---------- */
  .tabs{display:flex;gap:7px;margin-bottom:11px}
  .tab{font-size:10.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;
    border:1px solid var(--line);background:transparent;color:var(--muted-2);border-radius:999px;
    padding:6px 13px;cursor:pointer;font-family:inherit;transition:.15s}
  .tab:hover{color:var(--ink)}
  .tab.on{color:var(--gold);border-color:rgba(242,193,78,.45);background:rgba(242,193,78,.1)}
  .tab .w{color:var(--muted-2);font-weight:700;margin-left:7px;letter-spacing:.02em}
  .tab.on .w{color:rgba(242,193,78,.65)}

  /* ---------- the race ---------- */
  .race{flex:0 0 auto;border-top:1px solid var(--line);padding-top:12px;margin-top:12px}
  .racehead{display:flex;align-items:center;gap:14px;margin-bottom:9px}
  .racetitle{font-size:10.5px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;
    color:var(--muted-2)}
  .racetitle b{color:var(--ink)}
  .replay{margin-left:auto;font-size:11.5px;font-weight:800;letter-spacing:.06em;
    border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;
    padding:7px 16px;cursor:pointer;font-family:inherit;transition:.15s}
  .replay:hover{border-color:var(--gold);color:var(--gold)}
  .lanes{position:relative}
  .lane{display:grid;grid-template-columns:150px 1fr 82px;align-items:center;gap:12px;height:22px}
  .lane .who{font-size:11.5px;font-weight:700;white-space:nowrap;overflow:hidden;
    text-overflow:ellipsis;color:var(--muted)}
  .lane.win .who{color:var(--ink)}
  .lane .strip{position:relative;height:13px;border-radius:3px;
    background:linear-gradient(180deg,rgba(226,87,47,.09),rgba(226,87,47,.05));
    border:1px solid rgba(230,190,160,.07);overflow:hidden}
  .lane .dot{position:absolute;top:50%;width:9px;height:9px;border-radius:50%;
    background:var(--muted);transform:translate(-50%,-50%);left:0}
  .lane.win .dot{background:var(--gold);box-shadow:0 0 12px 2px rgba(242,193,78,.55)}
  .lane .trail{position:absolute;top:50%;height:2px;left:0;width:0;transform:translateY(-50%);
    background:linear-gradient(90deg,transparent,rgba(226,87,47,.55))}
  .lane.win .trail{background:linear-gradient(90deg,transparent,rgba(242,193,78,.75))}
  .lane .gap{font-size:11px;font-weight:800;color:var(--muted-2);text-align:right;
    font-variant-numeric:tabular-nums;white-space:nowrap}
  .lane.win .gap{color:var(--gold)}
  .finish{position:absolute;top:0;bottom:0;right:94px;width:2px;background:rgba(242,193,78,.4)}

  .foot{position:absolute;left:34px;bottom:7px;font-size:10.5px;color:var(--muted-2);z-index:2}
  .note{position:absolute;right:34px;bottom:7px;font-size:10.5px;color:var(--muted-2);z-index:2}
  @media (max-width:900px){ .body{grid-template-columns:1fr} .semis{display:none} }
</style>
</head>
<body>

<div class="top">
  <div class="brand"><b>Ultimate Championship</b> · Budapest 2026</div>
  <div class="days" id="days"></div>
</div>

<section class="card" id="card"></section>

<script>
const PROTO = "Men's 110 Metres Hurdles";     // the one card this prototype draws

const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const DAYNAME = ['', 'Day 1', 'Day 2', 'Day 3'];
let D, EV, PH, TAB = 0, RAF = null;

fetch('data/ultimate.json', {cache:'no-cache'}).then(r => r.json()).then(boot);

const fmtDate = iso => new Date(iso + 'T00:00:00')
  .toLocaleDateString('en-GB', {day:'numeric', month:'short'}).toUpperCase();

function boot(d){
  D = d;
  const days = [...new Set(D.timetable.map(p => p.dayNum))].sort();
  const dates = {}; D.timetable.forEach(p => dates[p.dayNum] = p.date);
  document.getElementById('days').innerHTML = days.map(n =>
    `<button class="day${n === 1 ? ' on' : ''}">${DAYNAME[n]}<i>${fmtDate(dates[n])}</i></button>`).join('');
  EV = D.results.find(e => e.event === PROTO);
  PH = D.timetable.filter(p => p.sexCode === EV.sex && PROTO.includes(p.discipline.name));
  draw();
}

/* races, final first — the final is what the card is about, the semis are behind a tab */
const racesOf = ev => {
  const fin = ev.races.filter(r => /final/i.test(r.name) && !/semi/i.test(r.name));
  const semi = ev.races.filter(r => /semi/i.test(r.name));
  return fin.concat(semi);
};

function rows(race, {skip = 0} = {}){
  return race.rows.slice(skip).map(r => {
    const out = !r.place;
    return `<tr class="${out ? 'out' : (r.qualified ? 'q' : '')}">
      <td class="p">${out ? '' : esc(r.place)}</td>
      <td class="n">${esc(r.name)}</td>
      <td class="c">${esc(r.nat)}</td>
      <td class="m r">${esc(out ? (r.remark || r.mark || '—') : r.mark)}</td></tr>`;
  }).join('');
}

function podium(race){
  return race.rows.slice(0, 3).map((r, i) => {
    const pic = r.wa && D.photos[r.wa];
    return `<div class="pod${i === 0 ? ' gold' : ''}">
      ${pic ? `<div class="ph" style="background-image:url('${D.photoBase}${pic}')"></div>` : ''}
      <div class="scrim"></div>
      <div class="pos">${r.place || ''}</div>
      <div class="nm">${esc(r.name)}</div>
      <div class="nat">${esc(r.nat)}</div>
      <div class="mk">${esc(r.mark)}</div>
      ${r.record ? `<div><span class="tag">${esc(r.record)}</span></div>` : ''}
    </div>`;
  }).join('');
}

/* ---------- the race ----------
   Every finisher run at their own average speed over the real distance, so the finish
   spread is the true one: the gap you see is metres, not tenths. */
const distOf = name => {
  const m = name.match(/(\d[\d,]*)\s*Metres/i);
  if (m) return +m[1].replace(/,/g, '');
  if (/^4x(\d+)/i.test(name)) return 4 * +name.match(/^4x(\d+)/i)[1];
  return null;
};
const secs = mark => {
  const m = String(mark).match(/^(?:(\d+):)?(\d+(?:\.\d+)?)$/);
  return m ? (+(m[1] || 0)) * 60 + +m[2] : null;
};

function raceStrip(race, dist, label){
  const runners = race.rows
    .filter(r => r.place && secs(r.mark))
    .map(r => ({name: r.name, nat: r.nat, t: secs(r.mark), mark: r.mark}));
  if (runners.length < 2 || !dist) return '';
  return `<div class="race">
    <div class="racehead">
      <div class="racetitle">Race the ${esc(label)} — <b>${dist} m</b>, every finisher at their own pace</div>
      <button class="replay" id="replay">▶ Run it</button>
    </div>
    <div class="lanes" id="lanes">
      <div class="finish"></div>
      ${runners.map((r, i) => `<div class="lane${i === 0 ? ' win' : ''}">
        <div class="who">${esc(r.name)} <span style="color:var(--muted-2)">${esc(r.nat)}</span></div>
        <div class="strip"><div class="trail"></div><div class="dot"></div></div>
        <div class="gap" data-mark="${esc(r.mark)}">${esc(r.mark)}</div>
      </div>`).join('')}
    </div></div>`;
}

function runRace(race, dist){
  const lanes = document.getElementById('lanes');
  if (!lanes) return;
  const runners = race.rows.filter(r => r.place && secs(r.mark)).map(r => secs(r.mark));
  const win = Math.min(...runners);
  const els = [...lanes.querySelectorAll('.lane')];
  const DUR = 4200;                                   // the winner's run, on screen
  cancelAnimationFrame(RAF);
  els.forEach(el => { el.querySelector('.dot').style.left = '0%';
                      el.querySelector('.trail').style.width = '0%';
                      el.querySelector('.gap').textContent = el.querySelector('.gap').dataset.mark; });
  const t0 = performance.now();
  let snapped = false;
  const step = now => {
    const el0 = (now - t0) / DUR;                     // 1.0 = the winner on the line
    let running = false;
    els.forEach((el, i) => {
      const frac = Math.min(1, el0 * win / runners[i]);
      if (frac < 1) running = true;
      el.querySelector('.dot').style.left = (frac * 100) + '%';
      el.querySelector('.trail').style.width = (frac * 100) + '%';
    });
    // the gaps are written once, on the frame the winner crosses — waiting for each runner to
    // still be short of the line misses anyone beaten by a hundredth
    if (el0 >= 1 && !snapped){
      snapped = true;
      els.forEach((el, i) => {
        if (runners[i] === win) return;               // the winner keeps their time
        const behind = dist - dist * (win / runners[i]);
        el.querySelector('.gap').textContent = '−' + behind.toFixed(behind < 1 ? 2 : 1) + ' m';
      });
    }
    if (el0 < 1.6 && running) RAF = requestAnimationFrame(step);
  };
  RAF = requestAnimationFrame(step);
}

function draw(){
  const all = racesOf(EV), race = all[TAB];
  const fp = PH.find(p => /final/i.test(p.phaseName) && !/semi/i.test(p.phaseName)) || PH[0];
  const disc = fp.discipline;
  const sex = fp.sexCode === 'W' ? "Women's" : fp.sexCode === 'M' ? "Men's" : 'Mixed';
  const when = new Date(fp.phaseDateAndTime);
  const dist = distOf(disc.name);
  const isFinal = TAB === 0;
  const card = document.getElementById('card');
  card.className = 'card' + (disc.isTrack ? ' track' : disc.isField ? ' field' : '');

  card.innerHTML = `
    <div class="head">
      <div>
        <div class="kicker"><span class="sx">${sex}</span> · <span class="type">${esc(disc.typeName)}</span>
          · ${DAYNAME[fp.dayNum]}</div>
        <h1>${esc(disc.name)}</h1>
      </div>
      <div class="when">
        <div class="st">${fp.isResultPublished ? 'Result' : 'Start list'}</div>
        <div class="dt">${when.toLocaleDateString('en-GB',{day:'numeric',month:'long'})}
          · ${when.toTimeString().slice(0,5)}</div>
      </div>
    </div>

    ${all.length > 1 ? `<div class="tabs">${all.map((r, i) =>
      `<button class="tab${i === TAB ? ' on' : ''}" data-i="${i}">${i ? 'Semifinal ' + r.n : 'Final'}
        ${r.wind != null ? `<span class="w">${esc(r.wind)}</span>` : ''}</button>`).join('')}</div>` : ''}

    ${isFinal ? `<div class="podium">${podium(race)}</div>` : ''}
    <div class="rest"><table>
      <tr><th></th><th>Athlete</th><th></th><th class="r">Mark</th></tr>
      ${rows(race, {skip: isFinal ? 3 : 0})}
    </table></div>

    ${raceStrip(race, dist, isFinal ? 'final' : 'semifinal')}

    <div class="foot">Data: World Athletics · A guy with a scarf</div>
    <div class="note">Prototype · one card of ${new Set(D.timetable.map(p => p.sexCode + p.discipline.name)).size}</div>`;

  card.querySelectorAll('.tab').forEach(b =>
    b.onclick = () => { TAB = +b.dataset.i; draw(); });
  const rep = document.getElementById('replay');
  if (rep){ rep.onclick = () => runRace(race, dist); setTimeout(() => runRace(race, dist), 450); }
}
</script>

</body>
</html>
